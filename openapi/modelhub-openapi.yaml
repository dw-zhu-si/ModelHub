openapi: 3.1.0
info:
  title: ModelHub Local Gateway API
  version: 1.10.0
  description: >
    模型枢纽提供的本机统一接口，覆盖聊天、图像、视频、音乐、语音、转录、
    Embedding 与 Rerank。服务仅监听 127.0.0.1，客户端使用应用中生成的
    Bearer 令牌访问。请求体支持 Content-Length 和 chunked；请求头上限
    64 KiB，解码后请求体上限 32 MiB，已知路径的错误方法返回 405。
    所有 HTTP 响应都使用 X-ModelHub-Request-ID 返回有界请求关联标识。
    可能计费的非流式 POST 请求可使用 Idempotency-Key；路由请求可使用
    X-ModelHub-Session-ID 提供只保存摘要的会话亲和提示。
servers:
  - url: http://127.0.0.1:11435
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: 检查本地网关状态
      security: []
      responses:
        "200":
          description: 服务可用
          headers:
            X-ModelHub-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/models:
    get:
      summary: 获取当前明确可用的模型与路由
      description: >
        默认目录只读取本机持久健康状态，不调用上游。仅返回状态为 available
        的启用供应商模型，以及至少包含一个明确可用目标的启用路由；隔离、
        不可用、未知状态和无可用目标的条目不会输出。
      responses:
        "200":
          description: 通用兼容模型列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/models/available:
    get:
      summary: 获取当前明确可用的模型与路由（兼容别名）
      description: >
        与 GET /v1/models 返回相同结果，保留此路径用于兼容旧客户端。
      responses:
        "200":
          description: 当前可用模型列表及数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/models/{modelId}/capabilities:
    get:
      summary: 获取一个当前可用模型的能力与参数约束
      description: >
        只读取已保存的本机能力元数据，不调用上游、不产生费用。模型 ID 中的
        斜杠必须进行 URL 编码。已隔离、不可用或当前令牌无权访问的模型统一返回
        404，避免泄露受限模型目录。路由只有在全部可用目标约束完全一致时才返回
        exact；否则 constraint_scope 为 provider_specific。
      parameters:
        - name: modelId
          in: path
          required: true
          description: 模型 ID 或路由别名；斜杠需编码为 %2F
          schema:
            type: string
      responses:
        "200":
          description: 模型能力、模态及图片/视频/音频参数约束
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 模型不存在、已隔离、不可用或当前令牌无权访问
  /v1/providers:
    get:
      summary: 获取供应商列表与原生透传标识
      responses:
        "200":
          description: 不含 API Key 的供应商列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/analytics:
    get:
      summary: 获取本月本机聚合用量
      description: 不返回提示词、响应正文或密钥；未知价格不会伪算。
      responses:
        "200":
          description: 按请求模型、供应商和真实模型聚合的成功率、延迟、Token 与估算费用
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/analytics/ledger:
    get:
      summary: 分页读取逐请求本地用量账本
      description: >
        按 UTC 月份读取；不返回提示词、响应正文、请求头或凭证秘密。
        credential_id 仅为不可用于认证的本地 UUID。
      parameters:
        - name: month
          in: query
          required: false
          description: UTC 月份，格式 yyyy-MM；默认当前 UTC 月
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: cursor
          in: query
          required: false
          description: >
            上一页 next_cursor 返回的不透明游标。为兼容 1.9.x，仍接受已弃用的非负整数行偏移输入。
          schema:
            oneOf:
              - type: string
                minLength: 1
              - type: integer
                minimum: 0
                deprecated: true
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: 隐私最小化的逐请求账本页
          content:
            application/json:
              schema:
                type: object
                required: [object, month, stores_request_bodies, data]
                properties:
                  object:
                    type: string
                    const: local.usage_ledger
                  month:
                    type: string
                  stores_request_bodies:
                    type: boolean
                    const: false
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  next_cursor:
                    type: string
                    description: 下一页使用的不透明游标；末页省略。
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/native:
    post:
      summary: 透传供应商专用原生协议
      description: >
        保留原始请求方法、正文、Content-Type、供应商扩展请求头和上游响应。
        provider 只能选择已配置供应商，path 只能是该供应商主机内的绝对路径。
        运行时同时支持 GET、POST、PUT、PATCH、DELETE。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: provider
          in: query
          required: true
          description: GET /v1/providers 返回的供应商 UUID 或供应商名称
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: 供应商文档中的原生路径，必须以 / 开头
          schema:
            type: string
            examples: [/mj/submit/imagine]
        - name: model
          in: query
          required: true
          description: 当前原生动作对应的已配置模型，用于状态记录与隔离
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 供应商不存在或未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 模型已隔离，未调用上游
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/chat/completions:
    post:
      summary: 创建聊天补全
      description: >
        model 可以是路由别名，也可以是“供应商名称/模型名称”。
        路由遇到网络错误、HTTP 429 或 5xx 时按配置尝试下一个目标。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: 通用兼容聊天补全响应
          headers:
            X-ModelHub-Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 模型或路由不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: 上游模型服务调用失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/responses:
    post:
      summary: 创建 通用协议 Responses API 响应
      description: 保留工具调用与多模态输入；stream=true 时以真正增量的 SSE 分块转发。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              additionalProperties: true
              properties:
                model: { type: string }
                stream: { type: boolean }
      responses:
        "200":
          description: Responses API JSON 或 SSE 响应
          headers:
            X-ModelHub-Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 模型已隔离，未调用上游
        "422":
          description: 流式响应不能与 Idempotency-Key 同时使用
  /mcp:
    post:
      summary: 本机只读 MCP Streamable HTTP 入口
      description: 使用独立 Agent Bearer 令牌；仅提供状态、可用模型和聚合用量工具。
      responses:
        "200": { description: JSON-RPC 响应 }
        "204": { description: MCP 通知已接受 }
        "401": { description: Agent 令牌无效 }
        "403": { description: Origin 不是本机回环地址 }
  /a2a:
    post:
      summary: 本机只读 A2A JSON-RPC 入口
      responses:
        "200": { description: JSON-RPC 响应 }
        "401": { description: Agent 令牌无效 }
  /.well-known/agent-card.json:
    get:
      summary: 获取 ModelHub 本机 A2A Agent Card
      responses:
        "200": { description: Agent Card }
        "401": { description: Agent 令牌无效 }
  /acp/manifest.json:
    get:
      summary: 获取 ACP stdio 启动清单
      description: 清单只含令牌占位符，实际进程为应用包内 ModelHubACP。
      responses:
        "200": { description: ACP 清单 }
        "401": { description: Agent 令牌无效 }
  /v1/images/generations:
    post:
      summary: 创建图像生成任务
      description: >
        保留供应商原生扩展字段，并将路由别名替换为真实模型名。
        image_url 是单张参考图的网关字段；千问图片模型会把它转换为
        input.messages[].content[].image。也可直接提交供应商原生 input。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationRequest"
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProtocolMismatch"
  /v1/music/generations:
    post:
      summary: 创建音乐生成任务
      description: >
        将 model 路由别名替换为真实模型名，并保留 lyrics、style、title、
        duration、instrumental 以及供应商扩展字段。上游只使用用户保存的
        精确音乐端点或精确 Base URL，ModelHub 不猜测供应商路径。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MusicGenerationRequest"
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProtocolMismatch"
        "409":
          description: 模型处于隔离状态，未调用上游
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/music/{task_id}:
    get:
      summary: 查询异步音乐任务
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - $ref: "#/components/parameters/RequiredModelQuery"
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/videos/generations:
    post:
      summary: 创建视频生成任务
      description: >
        APIMart 转发到 /v1/videos/generations，Agnes 转发到 /v1/videos；
        供应商原生参数原样保留。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeJSONRequest"
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProtocolMismatch"
  /v1/videos:
    post:
      summary: 创建视频生成任务（兼容别名）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeJSONRequest"
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tasks/{task_id}:
    get:
      summary: 查询异步视频任务
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - $ref: "#/components/parameters/RequiredModelQuery"
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/videos/{task_id}:
    get:
      summary: 查询异步视频任务（视频路径）
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - $ref: "#/components/parameters/RequiredModelQuery"
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/audio/speech:
    post:
      summary: 语音合成
      description: >
        通用兼容供应商使用 /v1/audio/speech；千问AI平台按模型系列转发至
        SpeechSynthesizer 或 multimodal-generation 原生 HTTP 接口。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeJSONRequest"
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/audio/transcriptions:
    post:
      summary: 音频转录
      description: >
        JSON 请求从正文读取 model；multipart/form-data 请求需同时在
        查询参数中提供 model，正文与 Content-Type 原样转发。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionID"
        - name: model
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeJSONRequest"
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/embeddings:
    post:
      summary: 创建向量
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeJSONRequest"
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/rerank:
    post:
      summary: 文档重排
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeJSONRequest"
      responses:
        "200":
          $ref: "#/components/responses/NativeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ModelHub token
  headers:
    RequestID:
      description: 用于将本次响应与本地请求日志关联；最长 80 个安全 ASCII 字符。
      schema:
        type: string
        maxLength: 80
    IdempotentReplay:
      description: true 表示该响应来自同一访问作用域内已完成请求的内存重放。
      schema:
        type: string
        enum: ["true", "false"]
  responses:
    NativeResponse:
      description: 供应商原生响应，状态码和 Content-Type 保持不变
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ProtocolMismatch:
      description: 模型不存在或模型协议与当前端点不匹配
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 访问令牌缺失或无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: 请求体无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        1–128 个安全 ASCII 字符。仅用于可能计费的非流式 POST；同一访问作用域、
        相同 Key 与相同请求只执行一次。同一 Key 用于不同请求返回 409。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    SessionID:
      name: X-ModelHub-Session-ID
      in: header
      required: false
      description: >
        路由会话亲和提示；ModelHub 只保存摘要并受 TTL/LRU 上限约束，原始值不写日志。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    RequiredModelQuery:
      name: model
      in: query
      required: true
      description: 路由别名或“供应商名称/模型名称”
      schema:
        type: string
  schemas:
    Health:
      type: object
      required: [status, service, providers, routes, observability]
      properties:
        status:
          const: ok
        service:
          const: ModelHub
        providers:
          type: integer
          minimum: 0
        routes:
          type: integer
          minimum: 0
        observability:
          type: object
          additionalProperties: true
          description: >
            仅包含有界聚合计数：响应缓存、代理会话、限流/排队/熔断、
            幂等协调、会话亲和、被动健康、媒体批处理以及模型验证新鲜度；
            不包含密钥、提示词或高基数请求/会话 ID 标签。
    Model:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [model, model.capabilities]
        created:
          type: integer
        owned_by:
          type: string
        availability:
          type: string
          enum: [unknown, available, unavailable, configurationRequired, unsupported]
        quarantined:
          type: boolean
        verification_freshness:
          type: string
          enum: [fresh, stale, never]
          description: >
            最近真实验证的时效性；stale 只作告警，不会自动隔离、恢复或发起请求。
        verified_at:
          type: string
          format: date-time
          description: 直连模型的验证时间，或路由当前可用目标中最早的验证时间。
        capabilities:
          type: array
          items:
            type: string
        constraint_scope:
          type: string
          enum: [exact, provider_specific, not_published]
        constraints:
          $ref: "#/components/schemas/ModelConstraintDetails"
    ModelCapabilities:
      allOf:
        - $ref: "#/components/schemas/Model"
        - type: object
          properties:
            object:
              const: model.capabilities
    ModelConstraintDetails:
      type: object
      additionalProperties: true
      description: >
        供应商目录或官方注册表提供的机器可读参数约束。可能包含
        input_modalities、output_modalities、image.sizes、image.aspect_ratios、
        video.resolutions、video.durations_seconds、audio.formats、
        audio.sample_rates_hz、parameters、source 与 updated_at；未发布的字段不猜测。
    ModelList:
      type: object
      required: [object, available_count, data]
      properties:
        object:
          const: list
        available_count:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model:
          type: string
          examples: [smart, gpt-4.1]
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
          minimum: 1
    ChatCompletion:
      type: object
      additionalProperties: true
      required: [id, object, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
    NativeJSONRequest:
      type: object
      required: [model]
      additionalProperties: true
      properties:
        model:
          type: string
          examples:
            - APIMart Seedance/doubao-seedance-2.0
            - Agnes AI/agnes-image-2.1-flash
    ImageGenerationRequest:
      type: object
      required: [model, prompt]
      additionalProperties: true
      properties:
        model:
          type: string
          description: 可用模型名、供应商/模型或路由别名
        prompt:
          type: string
          maxLength: 20000
        size:
          type: string
        quality:
          type: string
        image_url:
          type: string
          description: >
            可选的单张参考图；使用供应商支持的 HTTPS URL 或 data:image/...;base64,...，
            不接受本机 file URL。千问图片适配会将其放入多模态消息的 image 内容块。
        input:
          type: object
          additionalProperties: true
          description: 可选的供应商原生输入；存在非空 messages 时会优先保留。
    MusicGenerationRequest:
      type: object
      required: [model, prompt]
      additionalProperties: true
      properties:
        model:
          type: string
          description: 可用模型名、供应商/模型或路由别名
        prompt:
          type: string
          maxLength: 20000
        lyrics:
          type: string
          maxLength: 50000
        style:
          type: string
          maxLength: 2000
        title:
          type: string
          maxLength: 500
        duration:
          type: integer
          minimum: 1
          maximum: 600
        instrumental:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
