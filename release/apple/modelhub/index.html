    <h1>模型枢纽 ModelHub</h1>
    <p>一款原生 macOS 本机模型 API 网关。统一管理模型供应商、严格过滤隔离模型，并通过稳定别名执行能力、成本与健康状态感知路由。</p>
    <ul>
      <li>密钥保存在 macOS Keychain。</li>
      <li>服务仅监听本机回环地址。</li>
      <li>支持登录时启动、桌面小组件、用量分析与故障转移。</li>
      <li>支持 OpenAI、Anthropic、Gemini 及多种兼容供应商协议。</li>
      <li>支持简中、繁中、英、日、韩、西、法、德、巴西葡萄牙语、俄语和阿拉伯语。</li>
    </ul>
    <p><a href="privacy.html">隐私政策</a> · <a href="support.html">用户支持</a></p>
